<style>
:root{
  color-scheme:light;
  --navy:#14263D; --graphite:#25303A; --teal:#18AFA3; --action:#0F827A; --action-dk:#0B6B64;
  --paper:#F7F6F1; --white:#FFF; --mint:#DDF5F2; --mint-dk:#BFE7E2; --mint-soft:#EEFAF8;
  --line:#E3E1D9; --line-soft:#EFEDE6; --muted:#6B7680; --dim:#949BA2;
  --warn:#7A5312; --warn-bg:#FBF3E4; --warn-line:#E8D6AE;
  --bad:#A03B2C; --bad-bg:#FBEFEC; --bad-line:#EBD2CC;
  --up:#A46A22; --down:#18AFA3; --brass:#A46A22; --brass-lt:#E8B65C; --mint-lt:#8FE3DB;
  --g-act:linear-gradient(135deg,#0F827A,#0B6B64);
  --g-act-h:linear-gradient(135deg,#0D7871,#095A54);
  --g-act-a:linear-gradient(135deg,#0B6B64,#084E49);
  --g-prog:linear-gradient(90deg,#18AFA3,#0B6B64);
  --glow:0 3px 10px rgba(11,107,100,.16); --glow-sm:0 1px 5px rgba(11,107,100,.12);
  --r-card:16px; --r-btn:10px; --r-in:8px; --t:160ms;
  --pageP:12px; --pagePx:24px; --pagePb:14px; --pageG:12px;
  --hr1:48px; --hr2:38px; --stageG:22px; --headM:10px; --h1:22px; --h2:17px;
  --row:50px; --chip:48px; --gapF:8px; --gapB:12px; --gapFl:12px; --gapG:6px;
  --padBv:12px; --padBb:14px; --labM:6px; --navP:2px; --nextP:10px;
  --panP:15px; --panG:9px; --prevH:clamp(118px,18.4vh,170px); --specP:4px; --ptP:7px;
  --pcardP:10px; --ctaP:12px; --sum:26px; --repP:4px; --rcP:3px; --labF:15px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow:hidden}
body{margin:0;background:var(--paper);color:var(--graphite);
  font-family:Onest,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;color:var(--navy)}
:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- шапка ---------- */
.page{height:100vh;display:flex;flex-direction:column;padding:var(--pageP) var(--pagePx) var(--pagePb);gap:var(--pageG)}
.hbox{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);flex:none;
  overflow:hidden;position:relative}
.hr1{display:flex;align-items:center;gap:28px;padding:0 18px;height:var(--hr1)}
.hr2{display:flex;align-items:center;gap:16px;padding:0 18px;height:var(--hr2);
  background:var(--paper);border-top:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.02em;color:var(--navy);white-space:nowrap}
.logo .mark{width:22px;height:22px;flex:none}
.logo .lg{font-size:19px}
.logo i{font-style:normal;color:var(--action);font-weight:500;font-size:12px;margin-left:1px;
  border-bottom:2px solid var(--teal);padding-bottom:1px;align-self:flex-end;margin-bottom:3px}
.links{display:flex;gap:24px;font-size:14px}
.links a{color:var(--graphite);cursor:pointer;padding-bottom:2px}
.links a:hover{color:var(--navy)}
.links a.on{color:var(--action);font-weight:600;border-bottom:2px solid var(--teal)}
.hright{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:12.5px;color:var(--muted)}
.demo{display:flex;align-items:center;gap:7px}
.demo i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.hright{position:relative}
.tog{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;
  padding:4px 8px 4px 5px;border:1px solid var(--line);border-radius:22px;background:var(--white);
  transition:all var(--t)}
.tog:hover{border-color:var(--action);color:var(--navy)}
.tog .qm{width:19px;height:19px;border-radius:50%;background:var(--paper);color:var(--muted);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;transition:all var(--t)}
.tog .sw{width:30px;height:17px;border-radius:17px;background:var(--line);position:relative;
  transition:background var(--t);flex:none}
.tog .sw:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:var(--white);box-shadow:0 1px 3px rgba(20,38,61,.28);transition:transform var(--t)}
.tog.on{color:var(--navy);border-color:var(--action);background:var(--mint)}
.tog.on .qm{background:var(--action);color:#fff}
.tog.on .sw{background:var(--action)}
.tog.on .sw:after{transform:translateX(13px)}
.tog.pulse{animation:togpulse 1.9s var(--ease) 4}
@keyframes togpulse{0%,100%{border-color:var(--line);background:var(--white)}
  45%{border-color:var(--action);background:var(--mint)}}
.tog.pulse .qm{animation:qmpulse 1.9s var(--ease) 4}
@keyframes qmpulse{0%,100%{background:var(--paper);color:var(--muted)}
  45%{background:var(--action);color:#fff}}
.hintpop{position:fixed;width:264px;z-index:75;
  background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.45;
  box-shadow:0 20px 44px -20px rgba(20,38,61,.6);animation:popin 260ms var(--ease)}
.hintpop:after{content:"";position:absolute;top:-5px;right:var(--hx,44px);width:10px;height:10px;
  background:var(--navy);transform:rotate(45deg)}
.hintpop b{display:block;color:var(--teal);font-weight:600;margin-bottom:3px}
.hintpop .hb{display:flex;gap:14px;margin-top:9px;align-items:center}
.hintpop .hb button{font-size:12.5px;font-weight:600}
.hintpop .hb .y{color:var(--teal)}
.hintpop .hb .n{color:rgba(255,255,255,.6)}
@keyframes popin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--action);width:0;
  transition:width 320ms var(--ease);border-radius:0 3px 3px 0}
#nav{margin-left:auto}
.steps-nav{display:flex;align-items:center;gap:5px}
.steps-nav .lbl{font-size:12px;color:var(--muted);margin-right:3px}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  border:1px solid var(--line);background:var(--white);color:var(--dim);transition:all var(--t)}
.dot.done{background:var(--mint);border-color:var(--mint-dk);color:var(--action)}
.dot.now{background:var(--action);border-color:var(--action);color:#fff;font-weight:600}
.phase{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.phase b{font-weight:500;color:var(--navy)}
.phase .pn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:var(--action);color:#fff;font-weight:600}
.phase .pd{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  border:1px solid var(--mint-dk);background:var(--mint);color:var(--action)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.crumbs b{font-weight:500;color:var(--navy)}
.crumbs span{color:var(--dim)}

/* ---------- сцена ---------- */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.42fr) minmax(360px,.94fr);
  gap:var(--stageG);overflow:hidden}
.col{min-height:0;display:flex;flex-direction:column}
.head-row{display:flex;align-items:center;gap:12px;margin-bottom:var(--headM);flex:none;min-width:0}
h1{font-size:var(--h1);font-weight:700;letter-spacing:-.02em;white-space:nowrap;flex:none}
.head-row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}


/* ---------- повтор заказа ---------- */
.repeat{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--mint-soft);
  border:1px solid var(--mint-dk);border-radius:10px;padding:var(--repP) 8px;min-width:0;flex:none}
.repeat .rl{flex:none;font-size:11px;color:var(--action);font-weight:600;white-space:nowrap;letter-spacing:.01em}
.rcards{display:flex;gap:6px;min-width:0}
.rc{min-width:0;background:var(--white);border:1px solid var(--mint-dk);border-radius:6px;
  padding:var(--rcP) 9px;text-align:left;transition:all var(--t)}
.rc:hover{border-color:var(--action)}
.rc b{display:block;font-size:12px;font-weight:600;color:var(--navy);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc span{display:block;font-size:10.5px;color:var(--muted);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rall{flex:none;font-size:11.5px;font-weight:600;color:var(--action);white-space:nowrap}
.rall:hover{color:var(--action-dk)}
.kbdline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kbdline b{font-weight:500;color:var(--muted);background:var(--paper);border:1px solid var(--line);
  border-radius:5px;padding:0 5px;font-size:10.5px}

/* ---------- шаги ---------- */
.flow{display:flex;flex-direction:column;gap:var(--gapF);min-height:0;flex:0 1 auto}
.step{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);flex:none}
.step.open{border-color:var(--mint-dk);flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.step.open.anim{animation:pop var(--t) var(--ease)}
@keyframes pop{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:12px;width:100%;height:var(--row);padding:0 16px;text-align:left;
  border-radius:var(--r-card);transition:background var(--t)}
.row:hover{background:var(--paper)}
.row .n{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.row.done .n{background:var(--mint);color:var(--action);font-weight:700}
.row.cur .n{background:var(--action);color:#fff;font-weight:600}
.row.todo{cursor:default}
.row.todo:hover{background:none}
.row.todo .n{border:1px dashed var(--line);color:var(--dim)}
.row .nm{flex:none;width:130px;font-size:13px;color:var(--muted)}
.row.todo .nm{color:var(--dim)}
.row .vl{flex:1;min-width:0;font-weight:500;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ed{flex:none;font-size:13px;font-weight:600;color:var(--action);opacity:0;transition:opacity var(--t)}
.row:hover .ed{opacity:1}
.body{padding:var(--padBv) 16px var(--padBb);display:flex;flex-direction:column;gap:var(--gapB);min-height:0;overflow:hidden;flex:0 1 auto}
.bhead{display:flex;align-items:baseline;gap:10px;flex:none}
.bhead .n{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--action)}
.bhead h2{font-size:var(--h2);font-weight:600}
.bhead .cnt{margin-left:auto;font-size:11.5px;color:var(--dim)}
.fields{display:flex;flex-direction:column;gap:var(--gapFl);overflow:hidden;min-height:0;flex:0 1 auto}
.f-lab{display:flex;align-items:baseline;gap:8px;margin-bottom:var(--labM)}
.f-lab b{font-size:var(--labF);font-weight:600;color:var(--navy);letter-spacing:-.01em}
.f-lab em{font-style:normal;font-size:12px;color:var(--muted)}
.grid{display:grid;gap:var(--gapG)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g7{grid-template-columns:repeat(7,minmax(0,1fr))}

/* ---------- плашка варианта ---------- */
.chip{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 8px;
  min-height:var(--chip);padding:6px 10px 7px;border:1px solid var(--line);background:var(--white);
  border-radius:var(--r-in);color:var(--navy);font-size:14px;font-weight:400;text-align:left;overflow:hidden;
  transition:border-color var(--t),background var(--t),color var(--t)}
.chip .ct{grid-area:1/1/2/3;min-width:0;line-height:1.2;overflow-wrap:anywhere}
.chip .cs{grid-area:2/1;min-width:0;font-size:11px;font-weight:400;color:var(--muted);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cd{grid-area:2/2;justify-self:end;align-self:end;font-size:11.5px;font-weight:500;
  color:var(--muted);white-space:nowrap;letter-spacing:-.01em;transition:color var(--t)}
.chip:hover{border-color:var(--action);background:var(--mint)}
.chip .cd{grid-area:2/2;justify-self:end;min-width:0;font-size:11px;font-weight:500;
  color:var(--action);line-height:1.2;white-space:nowrap;opacity:0;
  transition:opacity 140ms var(--ease)}
.chip .cd.up{color:var(--brass)}
.step.open:hover .chip .cd,.chip:focus-visible .cd{opacity:1}
@media (hover:none){.chip .cd{opacity:1}}
.chip.on{background:var(--mint);border-color:var(--action);color:var(--navy);font-weight:500;
  box-shadow:inset 0 0 0 1px var(--action)}
.chip.on .cs{color:var(--action)}
.chip.on.dash{border-style:solid}
.chip.on .ct{padding-right:19px}
.chip.on:after{content:"\2713";position:absolute;top:6px;right:7px;width:15px;height:15px;
  border-radius:50%;background:var(--action);color:#fff;font-size:9px;line-height:15px;
  text-align:center;font-weight:700}
.chip.on:hover{background:var(--mint-dk);border-color:var(--action)}
.chip.dash{border-style:dashed;color:var(--muted)}
.chip.off{opacity:.45;cursor:not-allowed}
.chip.off:hover{border-color:var(--line);background:var(--white)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-in);padding:2px;gap:2px}
.seg button{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:400;color:var(--muted);transition:all var(--t)}
.seg button.on{background:var(--white);color:var(--navy);font-weight:500;box-shadow:0 1px 2px rgba(20,38,61,.08)}
.tin{min-height:44px;width:100%;border:1px solid var(--line);border-radius:var(--r-in);background:var(--white);
  padding:6px 10px;font:inherit;font-size:14px;color:var(--navy)}
.tin:focus{outline:2px solid var(--action);outline-offset:-1px}
.cust{display:flex;align-items:center;gap:8px}
.cust .tin{width:96px;text-align:center}
.cust span{font-size:13px;color:var(--muted)}
.note{display:flex;gap:9px;padding:9px 12px;border-radius:var(--r-in);background:var(--warn-bg);
  border:1px solid var(--warn-line);color:var(--warn);font-size:12.5px;line-height:1.4;align-items:flex-start}
.note b{font-weight:600}
.note .fix{margin-left:auto;flex:none;font-weight:600;text-decoration:underline;color:inherit;white-space:nowrap}
.hintline{font-size:12px;color:var(--muted)}
.navrow{display:flex;align-items:center;gap:12px;flex:none;padding-top:var(--navP)}
.navrow .back{font-size:13px;color:var(--muted);padding:6px 2px}
.navrow .back:hover{color:var(--navy)}
.navrow .hint{font-size:12px;color:var(--dim);margin-left:auto;text-align:right}
.next{margin-left:auto;background:var(--g-act);color:#fff;border-radius:var(--r-btn);
  padding:var(--nextP) 20px;font-size:14px;font-weight:600;box-shadow:var(--glow);
  transition:background var(--t),box-shadow var(--t)}
.navrow .hint + .next{margin-left:0}
.next:hover{background:var(--g-act-h)}
.next:active{background:var(--g-act-a)}
.next[disabled]{background:var(--line);color:var(--dim);cursor:not-allowed;box-shadow:none}

/* ---------- правая колонка ---------- */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);
  padding:var(--panP);display:flex;flex-direction:column;gap:var(--panG);min-height:0;position:sticky;top:0}
.peyebrow{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ptitle{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:-4px}
.prev{background:var(--paper);border-radius:12px;display:grid;place-items:center;
  height:var(--prevH);flex:none;overflow:hidden;position:relative}
.prev svg{width:100%;height:100%}
.prev-cap{text-align:center;font-size:11.5px;color:var(--muted);margin-top:-4px}
.prev-cap i{font-style:normal;color:var(--dim)}
.spec{display:flex;flex-direction:column;flex:none;border-top:1px solid var(--line-soft)}
.spec button{display:flex;align-items:baseline;gap:10px;padding:var(--specP) 0;border-bottom:1px solid var(--line-soft);
  width:100%;min-width:0;text-align:left;transition:opacity var(--t)}
.spec button:hover{opacity:.6}
.spec .k{flex:none;width:92px;font-size:12px;color:var(--muted)}
.spec .v{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--navy);text-align:right}
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:none}
.pt{border:1px solid var(--line);border-radius:var(--r-in);padding:var(--ptP) 8px;text-align:left;
  display:flex;flex-direction:column;gap:1px;min-width:0;transition:all var(--t)}
.pt:hover{border-color:var(--action)}
.pt.on{border-color:var(--action);background:var(--mint)}
.pt .t{font-size:12.5px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .d{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .s{font-size:13.5px;font-weight:700;color:var(--navy);margin-top:2px;white-space:nowrap}
.pcard{background:var(--paper);border-radius:12px;padding:var(--pcardP) 13px;display:flex;flex-direction:column;gap:2px;
  flex:none;position:relative}
.pcard .lab{font-size:12px;color:var(--muted)}
.pcard .sum{font-size:var(--sum);font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.pcard .per{font-size:12.5px;color:var(--graphite)}
.pcard .fine2{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.pcard .more{display:flex;align-items:center;justify-content:space-between;width:100%;
  margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;
  font-weight:500;color:var(--navy)}
.pcard .more:hover{color:var(--action)}

.pop{position:absolute;right:13px;top:8px;font-size:14px;font-weight:700;color:var(--brass);
  pointer-events:none;animation:popup 1200ms var(--ease) forwards}
.pop.neg{color:var(--action)}
@keyframes popup{0%{opacity:0;transform:translateY(6px)}18%{opacity:1;transform:translateY(0)}
  70%{opacity:1;transform:translateY(-2px)}100%{opacity:0;transform:translateY(-12px)}}
.cta{background:var(--g-act);color:#fff;border-radius:var(--r-btn);padding:var(--ctaP);font-size:15px;
  font-weight:600;text-align:center;box-shadow:var(--glow);
  transition:background var(--t),box-shadow var(--t);flex:none}
.cta:hover{background:var(--g-act-h)}
.cta:active{background:var(--g-act-a)}
.cta[disabled]{background:var(--line);color:var(--dim);cursor:not-allowed;box-shadow:none}
.plinks{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex:none;align-items:center}
.plinks button{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.plinks button:hover{color:var(--action)}
.fine{display:none;gap:6px;font-size:11.5px;color:var(--dim);line-height:1.35;flex:none}
@media (min-height:1000px){.fine{display:flex}}

/* ---------- экран проверки состава ---------- */
.docstage{flex:1;min-height:0;overflow-y:auto;padding:0 2px 24px 0}
.docwrap{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(360px,.94fr);gap:22px;align-items:start}
.doc{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:22px 24px}
.dochead{display:flex;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px}
.dochead .txt{flex:1;min-width:0}
.dochead .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--action)}
.dochead h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px}
.dochead p{margin:0;font-size:13.5px;color:var(--muted);max-width:52ch}
.thumb{flex:none;width:150px;background:var(--paper);border-radius:10px;padding:8px;text-align:center}
.thumb svg{width:100%;height:96px}
.thumb .tl{font-size:11px;color:var(--muted);margin-top:2px}
.okbar{display:flex;gap:10px;background:var(--mint);border-radius:10px;padding:12px 14px;margin:16px 0}
.okbar .ic{flex:none;width:18px;height:18px;border-radius:50%;background:var(--action);color:#fff;
  display:grid;place-items:center;font-size:11px}
.okbar b{display:block;font-size:13.5px;color:var(--navy)}
.okbar span{font-size:12.5px;color:var(--graphite)}
.dtable{display:flex;flex-direction:column}
.dtable .r{display:flex;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.dtable .r .k{flex:none;width:220px;color:var(--muted)}
.dtable .r .v{font-weight:600;color:var(--navy)}
.dsec{margin-top:20px}
.dsec h3{font-size:14px;font-weight:600;margin-bottom:8px}
.dsec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.dsec li{font-size:13px;color:var(--graphite);line-height:1.45}
.dbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border-radius:var(--r-btn);padding:11px 18px;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:var(--white);color:var(--navy);transition:all var(--t)}
.btn:hover{border-color:var(--action);color:var(--action)}
.btn.pri{background:var(--g-act);border-color:var(--action-dk);color:#fff;box-shadow:var(--glow)}
.btn.pri:hover{background:var(--g-act-h);color:#fff}
.dfine{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45;max-width:70ch}

/* ---------- диагностика конфигурации ---------- */
.dg{display:flex;align-items:center;gap:8px;width:100%;text-align:left;flex:none;
  padding:6px 10px;border-radius:11px;border:1px solid var(--line);background:var(--paper);
  transition:border-color var(--t),background var(--t)}
.dg .dgi{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff;line-height:1}
.dg .dgt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.dg .dgt b{font-size:12px;font-weight:600;color:var(--navy);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg .dgt span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg .dgm{margin-left:auto;flex:none;font-size:11px;font-weight:600;line-height:1.35;
  padding:3px 9px;border-radius:7px;border:1px solid currentColor;transition:all var(--t)}

.dg.ok{background:var(--mint-soft);border-color:var(--mint-dk)}
.dg.ok .dgi{background:var(--action)}
.dg.tip{background:var(--mint-soft);border-color:var(--mint-dk)}
.dg.tip .dgi{background:var(--action)}
.dg.tip .dgm,.dg.ok .dgm{color:var(--action)}
.dg.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.dg.warn .dgi{background:var(--warn)}
.dg.warn .dgm{color:var(--warn)}
.dg.crit{background:var(--bad-bg);border-color:var(--bad-line)}
.dg.crit .dgi{background:var(--bad)}
.dg.crit .dgm{color:var(--bad)}
.dg[data-diag]:hover{filter:brightness(.985)}
.dg.ok:hover .dgm,.dg.tip:hover .dgm{color:#fff;background:var(--action);border-color:var(--action)}
.dg.warn:hover .dgm{color:#fff;background:var(--warn);border-color:var(--warn)}
.dg.crit:hover .dgm{color:#fff;background:var(--bad);border-color:var(--bad)}
.dcards{display:grid;gap:9px;margin-top:4px}
.dcards.wide{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-left:3px solid var(--dc,var(--action));
  border-radius:11px;padding:11px 13px 12px;background:var(--white)}
.dcard.crit{--dc:var(--bad);background:var(--bad-bg)}
.dcard.warn{--dc:var(--warn);background:var(--warn-bg)}
.dcard.tip{--dc:var(--action);background:var(--mint-soft)}
.dcard.ok{--dc:var(--action);background:var(--mint-soft)}
.dcard .dlv{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--dc)}
.dcard h4{margin:3px 0 0;font-size:14px;font-weight:600;color:var(--navy);line-height:1.3}
.dcard p{margin:5px 0 0;font-size:12.5px;line-height:1.45;color:var(--graphite)}
.dcard .dfix{margin-top:9px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:8px;
  border:1px solid var(--dc);color:var(--dc);background:transparent;transition:all var(--t)}
.dcard .dfix:hover{background:var(--dc);color:#fff}

/* ---------- вылеты ---------- */
.bleed{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.bleed h3{font-size:14px;font-weight:600;margin-bottom:12px}
.bleedwrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.bleedart{flex:none;width:auto;max-width:290px;background:var(--paper);border-radius:12px;padding:14px}
.bleedart svg{width:244px;max-width:100%;height:auto;display:block}
.bleedlist{flex:1;min-width:220px;display:flex;flex-direction:column;gap:0}
.bl{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.bl:last-child{border-bottom:0}
.bl .sw{flex:none;width:24px;height:0;border-top-width:2px;border-top-style:solid;position:relative;top:-4px}
.bl .k{flex:1;color:var(--muted)}

/* ---------- модалка, тост, тултип ---------- */

function norm(t){
  var m=matOf(t)||MATS[1];
  if(m.d.indexOf(t.dens)<0)t.dens=m.d[Math.min(2,m.d.length-1)];
  if(t.cover==='card')t.lam='no';

}
function clone(o){var r={};for(var k in o)r[k]=o[k];return r}
function base(){
  var t=clone(s);
  if(!t.fmt)t.fmt='a5';
  if(t.fmt==='cu'&&!(+t.cw>=70&&+t.ch>=70)){t.cw=148;t.ch=210}
  if(!t.pages)t.pages=16;
  if(!t.cover)t.cover='same';
  if(!t.mat)t.mat='mt';
  if(!t.print)t.print='4+4';
  if(!t.lam)t.lam='no';
  if(qtyOf(t)<1){t.qty=100;t.cq=''}
  return norm(t);
}
function calcOf(t){
  var A=areaOf(t),P=t.pages,mk=MATK[t.mat];
  var pr={'4+4':2.30,'4+0':1.40,'1+1':.95,'1+0':.60}[t.print];
  var blockPrint=P*A*pr;
  var blockPaper=(P/2)*(t.dens*.011)*A*mk;
  var coverPrint=(t.cprint==='4+4'?4:2)*A*2.30;
  var coverPaper=2*(coverDensOf(t)*.011)*A*coverKOf(t);
  var lam=(t.cover==='card'?0:LAMP[t.lam])*A*2;
  var finish=3+.12*P;
  var unit0=blockPrint+blockPaper+coverPrint+coverPaper+lam+finish;
  var q=qtyOf(t);
  var k=q<25?1:q<50?.95:q<100?.9:q<250?.84:q<500?.78:.72;
  var pk=(PROD.find(function(x){return x.v===t.prod})||PROD[0]).k;
  var setup=900*pk;
  var total=Math.round((unit0*k*pk*q+setup)/10)*10;
  return {total:total,unit:total/q,q:q,k:k,pk:pk,setup:setup,unit0:unit0,
    parts:[['Печать блока',blockPrint],['Бумага блока',blockPaper],['Печать обложки',coverPrint],
           ['Бумага обложки',coverPaper],['Плёнка',lam],['Сборка и скрепка',finish]]};
}

function delta(field,val){
  var b=base(),a=calcOf(b).total,t=clone(b);
  t[field]=val; norm(t);

}

    p:'Картон '+cd+' г/м² без биговки трескается на фальце, краска ломается по линии сгиба. Мы делаем биговку автоматически — она уже в цене.'});
  if(s.pages>=32) out.push({lv:'tip',t:'Выползание '+nf1(creepMm(s))+' мм',
    p:'Внутренние полосы длиннее внешних на '+nf1(creepMm(s))+' мм и обрежутся сильнее. Отодвиньте текст от внутреннего поля на '+Math.ceil(creepMm(s)+2)+' мм.'});
  if(s.fmt==='cu') out.push({lv:'tip',t:'Нестандартный формат',
    p:'Размер вне стандартного ряда не ложится в раскрой без остатка: отход бумаги выше на 5–8%, это уже учтено в цене.'});
  var ord={crit:0,warn:1,tip:2};
  return out.sort(function(a,b){return ord[a.lv]-ord[b.lv]});
}
function diagCount(rs){var c={crit:0,warn:0,tip:0};rs.forEach(function(r){c[r.lv]++});return c}

/* ===================== схема вылетов ===================== */
function svgBleed(){
  var d=dimsOf(s),w=d[0]||148,h=d[1]||210;
  if(s.orient==='land'&&s.fmt!=='cu'){var z=w;w=h;h=z}
  var W=w+6,H=h+6,pad=22,box=248;
  var sc=Math.min((box-pad*2)/W,(box-pad*2)/H);
  var bw=W*sc,bh=H*sc,VW=bw+pad*2,VH=bh+pad*2;
  var bx=pad,by=pad;
  var tx=bx+3*sc,ty=by+3*sc,tw=w*sc,th=h*sc;
  var sx=tx+5*sc,sy=ty+5*sc,sw=(w-10)*sc,sh=(h-10)*sc;
  var mono=!(s.print&&s.print.charAt(0)==='4');
  var acc=mono?'#8A949C':'#18AFA3', ink=mono?'#59636C':'#14263D';
  var pc=PAPC[s.cover==='card'?'ds':(s.cover==='sep'?'mt':s.mat)]||'#FBFAF6';
  var lw=Math.max(.7,sh*.009), lead=sh*.042;
  function bar(x,y2,ww,hh,f,op,r){
    return '<rect x="'+x.toFixed(1)+'" y="'+y2.toFixed(1)+'" width="'+ww.toFixed(1)+'" height="'+hh.toFixed(1)
     +'" rx="'+(r==null?.8:r)+'" fill="'+f+'"'+(op!=null?' opacity="'+op+'"':'')+'/>';
  }
  var o='<svg viewBox="0 0 '+VW.toFixed(1)+' '+VH.toFixed(1)+'" xmlns="http://www.w3.org/2000/svg" role="img">';
  o+='<defs><clipPath id="blc"><rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'"/></clipPath>'
   +'<linearGradient id="blg" x1="0" y1="0" x2="1" y2="1">'
   +'<stop offset="0" stop-color="'+acc+'" stop-opacity=".48"/>'
   +'<stop offset="1" stop-color="'+ink+'" stop-opacity=".28"/></linearGradient></defs>';
  /* бумага целиком, включая поле вылета */
  o+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="'+pc+'"/>';
  o+='<g clip-path="url(#blc)">';
  /* фотография уходит за линию реза: сверху, слева и справа — в вылет */
  var iy=by-4, ih=(ty+th*.44)-iy, ix=bx-4, iw=bw+8;
  o+='<rect x="'+ix+'" y="'+iy+'" width="'+iw+'" height="'+ih.toFixed(1)+'" fill="url(#blg)"/>';
  var rr=Math.min(iw,ih)*.85;
  o+='<path d="M'+ix+' '+(iy+ih).toFixed(1)+' L'+ix+' '+(iy+ih-rr).toFixed(1)
   +' A '+rr.toFixed(1)+' '+rr.toFixed(1)+' 0 0 0 '+(ix+rr).toFixed(1)+' '+(iy+ih).toFixed(1)+' Z" fill="#FFFFFF" opacity=".13"/>';
  /* подпись и текст — внутри безопасного поля */
  o+=bar(sx,ty+th*.50,sw*.26,lw*1.1,ink,.34);
  o+=bar(sx,ty+th*.565,sw*.74,sh*.027,ink,.78,1);
  o+=bar(sx,ty+th*.615,sw*.48,sh*.027,ink,.78,1);
  o+=bar(sx,ty+th*.675,sw,lw*.7,ink,.16,0);
  var ws=[1,.96,1,.92,.99,.62];
  for(var i=0;i<6;i++)o+=bar(sx,ty+th*.715+i*lead,sw*ws[i],lw,ink,.34);
  o+='</g>';
  /* линии-обозначения: вылет — штрих, рез — сплошная, безопасное поле — точки */
  o+='<rect x="'+sx+'" y="'+sy+'" width="'+sw+'" height="'+sh+'" fill="none" stroke="#5C6773" '
   +'stroke-width="1.1" stroke-dasharray="1 3.2" stroke-linecap="round"/>';
  o+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="none" stroke="'+(mono?'#59636C':'#18AFA3')
   +'" stroke-width="1.4" stroke-dasharray="7 4"/>';
  o+='<rect x="'+tx+'" y="'+ty+'" width="'+tw+'" height="'+th+'" fill="none" stroke="#14263D" stroke-width="1.6"/>';
  [[tx,ty,-1,-1],[tx+tw,ty,1,-1],[tx,ty+th,-1,1],[tx+tw,ty+th,1,1]].forEach(function(p){
    o+='<path d="M'+p[0]+' '+(p[1]+p[3]*9)+' V'+(p[1]+p[3]*19)+'" stroke="#14263D" stroke-width="1"/>';
    o+='<path d="M'+(p[0]+p[2]*9)+' '+p[1]+' H'+(p[0]+p[2]*19)+'" stroke="#14263D" stroke-width="1"/>';
  });
  o+='</svg>';
  return o;
}

function esc(x){return String(x).replace(/"/g,'&quot;')}
function chips(field,items,cls,opt){
  opt=opt||{};

  });

  items.forEach(function(it,i){
    var on=it.on,d=ds[i],show=d!==null&&Math.abs(d)>=5&&!on;
    h+='<button class="chip'+(on?' on':'')+(it.off?' off':'')+(it.dash?' dash':'')+'"'
     +(it.off?' disabled':'')+' data-set="'+field+'" data-v="'+esc(it.v)+'"'
     +(it.tip?' data-tip="'+esc(it.tip)+(show?' | '+(d<0?'Дешевле текущего расчёта на '+money(-d):'Дороже текущего расчёта на '+money(d))+' ₽':'')+'"':'')+'>'
     +'<span class="ct">'+it.t+'</span>'
     +(it.sub?'<span class="cs">'+it.sub+'</span>':'')

     +'</button>';

/* ===================== адресная строка ===================== */
function toHash(){
  var p=['f='+(s.fmt||''),'o='+s.orient];
  if(s.fmt==='cu')p.push('w='+s.cw,'h='+s.ch);
  if(s.pages)p.push('p='+s.pages);
  if(s.cover)p.push('c='+s.cover);
  if(s.mat)p.push('m='+s.mat);
  if(s.dens)p.push('d='+s.dens);
  if(s.covmat)p.push('cm='+s.covmat);
  if(s.print)p.push('pr='+s.print);
  p.push('cp='+s.cprint);
  if(s.lam)p.push('l='+s.lam);
  if(s.qty)p.push('q='+(s.qty==='cu'?s.cq:s.qty));
  p.push('t='+s.prod);
  try{history.replaceState(null,'','#'+p.join(';'))}catch(e){}
}
function fromHash(){
  var h=(location.hash||'').replace('#','');if(!h)return false;
  var m={};h.split(';').forEach(function(kv){var a=kv.split('=');if(a[0])m[a[0]]=a[1]});
  if(!m.f)return false;
  s.fmt=m.f; s.orient=m.o||'port';
  if(m.w)s.cw=m.w; if(m.h)s.ch=m.h;
  if(m.p)s.pages=+m.p; if(m.c)s.cover=m.c; if(m.m)s.mat=m.m; if(m.d)s.dens=+m.d;
  if(m.cm)s.covmat=m.cm; if(m.pr)s.print=m.pr; if(m.cp)s.cprint=m.cp; if(m.l)s.lam=m.l;
  if(m.q){var q=+m.q;if(QTY.indexOf(q)>=0)s.qty=q;else{s.qty='cu';s.cq=String(q)}}
  if(m.t)s.prod=m.t;
  return true;
}

function pop(diff){
  var c=document.getElementById('pcard'); if(!c||Math.abs(diff)<5)return;
  var e=document.createElement('div');
  e.className='pop'+(diff<0?' neg':'');
  e.textContent=num(diff);
  c.appendChild(e); setTimeout(function(){e.remove()},1300);
}
function roll(el,from,to){
  if(!el||from===to||!from){if(el)el.textContent=money(to)+' ₽';return}
  var t0=performance.now();
  requestAnimationFrame(function step(t){
    var k=Math.min(1,(t-t0)/300),e=1-Math.pow(1-k,3);
    el.textContent=money(from+(to-from)*e)+' ₽';
    if(k<1)requestAnimationFrame(step);
  });
}

/* ===================== события ===================== */
document.addEventListener('click',function(e){
  if(e.target.closest('[data-close]')||e.target.matches('[data-scrim]')){closeModal();return}
  if(e.target.closest('[data-undo]')){
    if(undoState){s=undoState;undoState=null;flip=1;render();document.getElementById('toast').className=''}
    return;
  }
  var ord=e.target.closest('[data-order]'); if(ord){applyOrder(ord.dataset.order);return}
  if(e.target.closest('[data-all]')){openTemplates();return}
  if(e.target.closest('[data-hint-on]')){
    hints=true; try{localStorage.setItem('tirio_hints','1')}catch(x){}
    closeTogHint(); render(); return;
  }
  if(e.target.closest('[data-hint-off]')){closeTogHint();return}
  if(e.target.closest('#tog')){
    hints=!hints; try{localStorage.setItem('tirio_hints',hints?'1':'0')}catch(x){}
    closeTogHint(); render(); return;
  }
  var fx=e.target.closest('[data-fix]');
  if(fx){var a=fx.dataset.fix.split(':');s[a[0]]=isNaN(+a[1])?a[1]:+a[1];render();return}
  var b=e.target.closest('[data-set]');
  if(b&&!b.disabled){
    var f=b.dataset.set,v=b.dataset.v;
    if(f==='pages'||f==='dens')v=+v;
    if(f==='qty'&&v!=='cu')v=+v;
    if(f==='prod'){s.prod=v;paintPanel();toHash();return}
    if(f==='fmt'||f==='pages'||f==='orient')flip=1;
    s[f]=v;
    if(f==='mat'){var m=matOf(s);if(m.d.indexOf(s.dens)<0)s.dens=null}
    if(f==='cover'&&v!=='sep')s.covmat=null;
    if(f==='cover'&&v==='card')s.lam='no';
    if(f==='fmt'&&v!=='cu'){s.cw='';s.ch=''}
    render(); return;
  }
  var nx=e.target.closest('[data-next]');
  if(nx&&!nx.disabled){
    var i=+nx.dataset.next;
    if(i<4){oi=i+1;render();
      if(window.innerWidth<=1000)document.querySelectorAll('.step')[oi].scrollIntoView({behavior:'smooth',block:'center'});
    }else{view='doc';window.scrollTo(0,0);render()}
    return;
  }
  if(e.target.closest('[data-check]')){
    if(view==='doc'){toast('Оформление заказа в прототипе отключено');return}
    if(allDone()){view='doc';window.scrollTo(0,0);render()}
    return;
  }
  if(e.target.closest('[data-edit]')){view='calc';render();return}
  if(e.target.closest('[data-diag]')){openDiag();return}
  if(e.target.closest('[data-details]')){openDetails();return}
  if(e.target.closest('[data-json]')){openJson();return}
  if(e.target.closest('[data-print]')){window.print();return}
  if(e.target.closest('[data-reset]')){
    undoState=clone(s);
    s={fmt:null,cw:'',ch:'',orient:'port',pages:null,cover:null,mat:null,dens:null,covmat:null,
       print:null,cprint:'4+0',lam:null,qty:null,cq:'',prod:'std'};
    oi=0;view='calc';lastSum=0;render();toast('Расчёт сброшен',true);return;
  }
  if(e.target.closest('[data-link]')){
    toHash();
    var url=location.href;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){toast('Ссылка на расчёт скопирована')},function(){linkModal(url)});
    }else linkModal(url);
    return;
  }
  var g=e.target.closest('[data-go]');
  if(g&&!g.disabled){
    var k=+g.dataset.go;
    if(view==='doc'){view='calc';oi=k;render();return}
    if(k===oi&&g.classList.contains('row'))return;
    oi=k;render();
    if(window.innerWidth<=1000)document.querySelectorAll('.step')[oi].scrollIntoView({behavior:'smooth',block:'center'});
  }
},true);
function linkModal(url){
  document.getElementById('modal').innerHTML='<div class="scrim" data-scrim><div class="modal">'
   +'<h3>Ссылка на расчёт</h3><div class="msub">Скопируйте её и отправьте коллеге — параметры откроются в том же виде.</div>'
   +'<textarea class="code" style="height:80px" readonly>'+url+'</textarea>'
   +'<button class="mclose" data-close>Закрыть</button></div></div>';
  var ta=document.querySelector('.code'); if(ta){ta.focus();ta.select()}
}

document.getElementById('mbarCta').addEventListener('click',function(){
  if(view==='doc'){toast('Оформление заказа в прототипе отключено');return}
  if(allDone()){view='doc';window.scrollTo(0,0);render();return}
  if(DONE[oi]()&&oi<4){oi++;render();document.querySelectorAll('.step')[oi].scrollIntoView({behavior:'smooth',block:'center'})}
});

document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='cw'||id==='ch'||id==='cq'){
    var v=e.target.value.replace(/\D/g,'').slice(0,4);
    e.target.value=v; s[id]=v;
    if(id==='cq'&&v)s.qty='cu';
    paintPanel(); toHash();
    document.getElementById('nav').querySelectorAll('.dot').forEach(function(d,i){d.classList.toggle('done',DONE[i]())});
    var done=DONE.filter(function(f){return f()}).length;
    document.getElementById('prog').style.width=(done/5*100)+'%';
    var nb=document.querySelector('.next'); if(nb)nb.disabled=!DONE[oi]();
  }
});

/* ===================== клавиатура ===================== */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();return}
  var inField=/^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if(inField&&e.key!=='Enter')return;
  if(e.key>='1'&&e.key<='5'&&view==='calc'&&!e.ctrlKey&&!e.metaKey){
    oi=+e.key-1;render();e.preventDefault();return;
  }
  if(e.key==='Enter'&&view==='calc'){
    var chip=e.target.closest&&e.target.closest('.chip');
    if(chip)return;
    if(DONE[oi]()){e.preventDefault();
      if(oi<4){oi++;render()}else{view='doc';render()}}
    return;
  }
  if(view!=='calc')return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key)<0)return;
  var list=[].slice.call(document.querySelectorAll('.step.open .chip:not([disabled]), .step.open .seg button'));
  if(!list.length)return;
  var cur=list.indexOf(document.activeElement);
  var step=1;
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    var grid=(document.activeElement&&document.activeElement.parentElement)||null;
    if(grid&&grid.classList.contains('grid'))
      step=getComputedStyle(grid).gridTemplateColumns.split(' ').length;
  }
  var dir=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1;
  var next=cur<0?0:cur+dir*step;
  if(next<0)next=0; if(next>=list.length)next=list.length-1;
  list[next].focus(); e.preventDefault();
});

/* ===================== тултипы ===================== */
(function(){
  var tip=document.getElementById('tip'),tmr=null,cur=null;
  var touch=window.matchMedia('(hover:none)').matches;
  function show(el){
    var t=el.dataset.tip; if(!t)return;
    cur=el;
    var parts=t.split(' | ');
    tip.innerHTML=(parts[1]?'<b class="'+(parts[1].indexOf('\u0414\u043e\u0440\u043e\u0436\u0435')===0?'up':'dn')+'">'+parts[1]+'</b>':'')+parts[0];
    tip.classList.remove('below');
    tip.style.left='0px';tip.style.top='0px';tip.classList.add('on');
    var r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    var x=Math.max(10,Math.min(window.innerWidth-tw-10,r.left+r.width/2-tw/2));
    var y=r.top-th-9,below=false;
    if(y<8){y=r.bottom+9;below=true}
    tip.style.left=x+'px';tip.style.top=y+'px';
    tip.style.setProperty('--ax',(r.left+r.width/2-x)+'px');
    if(below)tip.classList.add('below');
  }
  function hide(){clearTimeout(tmr);cur=null;tip.classList.remove('on')}
  document.addEventListener('mouseover',function(e){
    if(touch)return;
    var el=e.target.closest('[data-tip]');
    if(!el){if(cur)hide();return}
    if(el===cur)return;
    clearTimeout(tmr);tmr=setTimeout(function(){show(el)},400);
  });
  document.addEventListener('mouseout',function(e){if(e.target.closest('[data-tip]'))hide()});
  document.addEventListener('focusin',function(e){var el=e.target.closest('[data-tip]');if(el)show(el);else hide()});
  document.addEventListener('focusout',hide);
  window.addEventListener('scroll',hide,true);
  document.addEventListener('click',hide,true);
})();

if(fromHash()){oi=4;for(var q=0;q<5;q++)if(!DONE[q]()){oi=q;break}}
render();
setTimeout(showTogHint,1100);
</script>
